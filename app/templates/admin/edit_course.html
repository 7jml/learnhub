{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-4">
            <div class="card-body">
                <h4 class="mb-4">Edit Course</h4>
                <form method="POST">
                    <div class="mb-3">
                        <label>Course Title</label>
                        <input type="text" name="title" class="form-control" value="{{ course.title }}" required>
                    </div>
                    <div class="mb-3">
                        <label>Description</label>
                        <textarea name="description" class="form-control" rows="4" required>{{ course.description }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label>Instructor</label>
                        <input type="text" name="instructor" class="form-control" value="{{ course.instructor }}" required>
                    </div>
                    <button type="submit" class="btn btn-dark">Update Course</button>
                    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
